let revealAll = false;
let totalDetected = 0;
let uniqueTypes = new Set();

function detect(text) {
  const results = [];
  for (const p of PATTERNS) {
    p.regex.lastIndex = 0;
    let m;
    while ((m = p.regex.exec(text)) !== null) {
      results.push({ type: p.type, label: p.label, value: m[0], index: m.index, length: m[0].length, color: p.color });
    }
  }
  // resolve overlaps
  results.sort((a, b) => a.index - b.index || b.length - a.length);
  const resolved = [];
  for (const r of results) {
    const overlap = resolved.find(e => r.index < e.index + e.length && r.index + r.length > e.index);
    if (!overlap) resolved.push(r);
    else if (r.length > overlap.length) { resolved[resolved.indexOf(overlap)] = r; }
  }
  return resolved;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderLine(lineObj, lineNum) {
  if (lineObj.cls === 'comment') {
    return `<span class="line"><span class="line-num">${lineNum}</span><span class="comment">${escHtml(lineObj.text)}</span></span>`;
  }

  let raw;
  if (lineObj.key !== undefined) {
    const eq = lineObj.eq || '=';
    const suffix = lineObj.suffix || '';
    raw = lineObj.key + eq + lineObj.val + suffix;
  } else {
    raw = lineObj.text;
  }

  if (lineObj.safe) {
    return `<span class="line"><span class="line-num">${lineNum}</span><span class="safe-val">${escHtml(raw)}</span></span>`;
  }

  if (!protectionOn) {
    return `<span class="line"><span class="line-num">${lineNum}</span>${escHtml(raw)}</span>`;
  }

  const detections = detect(raw);
  if (detections.length === 0) {
    return `<span class="line"><span class="line-num">${lineNum}</span>${escHtml(raw)}</span>`;
  }

  let html = `<span class="line"><span class="line-num">${lineNum}</span>`;
  let cursor = 0;

  for (const d of detections) {
    if (d.index > cursor) {
      const prefix = raw.slice(cursor, d.index);
      // color key names
      if (lineObj.key && cursor === 0) {
        const eqPos = prefix.indexOf(lineObj.eq || '=');
        if (eqPos >= 0) {
          html += `<span class="key-name">${escHtml(prefix.slice(0, eqPos))}</span>${escHtml(prefix.slice(eqPos))}`;
        } else {
          html += escHtml(prefix);
        }
      } else {
        html += escHtml(prefix);
      }
    }

    totalDetected++;
    uniqueTypes.add(d.type);

    const secretText = raw.slice(d.index, d.index + d.length);
    const fillerFn = FILLERS[currentStyle]();
    const displayText = (currentStyle === 'blur' || revealAll) ? escHtml(secretText) : escHtml(fillerFn(secretText.length));
    const revealCls = revealAll ? ' revealed' : '';
    html += `<span class="redacted style-${currentStyle}${revealCls}" title="${escHtml(d.label)} (${d.type})" data-original="${escHtml(secretText)}" style="color:${d.color}">${displayText}</span>`;

    cursor = d.index + d.length;
  }

  if (cursor < raw.length) {
    html += escHtml(raw.slice(cursor));
  }

  html += '</span>';
  return html;
}

function renderAll() {
  const start = performance.now();
  totalDetected = 0;
  uniqueTypes = new Set();
  const container = document.getElementById('panels');
  let panelsHtml = '';

  for (const scenario of SCENARIOS) {
    let linesHtml = '';
    let panelDetections = 0;
    const prevTotal = totalDetected;

    for (let i = 0; i < scenario.lines.length; i++) {
      linesHtml += renderLine(scenario.lines[i], i + 1) + '\n';
    }

    panelDetections = totalDetected - prevTotal;
    const badgeCls = panelDetections === 0 ? 'badge clean' : 'badge';
    const badgeText = panelDetections === 0 ? 'CLEAN' : `${panelDetections} BLOCKED`;

    panelsHtml += `
      <div class="panel">
        <div class="panel-header">
          <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
          <span class="title">${escHtml(scenario.title)}</span>
          <span class="${badgeCls}">${badgeText}</span>
        </div>
        <div class="panel-body"><pre>${linesHtml}</pre></div>
      </div>`;
  }

  container.innerHTML = panelsHtml;

  const elapsed = (performance.now() - start).toFixed(1);
  document.getElementById('count-detected').textContent = totalDetected;
  document.getElementById('count-types').textContent = uniqueTypes.size;
  document.getElementById('detect-time').textContent = elapsed;

  // Click-to-reveal on redacted spans
  container.querySelectorAll('.redacted').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('revealed')) {
        el.classList.remove('revealed');
        const fillerFn = FILLERS[currentStyle]();
        if (fillerFn) el.textContent = fillerFn(el.dataset.original.length);
        else el.textContent = el.dataset.original;
      } else {
        el.classList.add('revealed');
        el.textContent = el.dataset.original;
      }
    });
  });

  // Copy detection
  container.querySelectorAll('.panel-body').forEach(panel => {
    panel.addEventListener('copy', () => {
      const hint = document.getElementById('copy-hint');
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 2000);
    });
  });
}

// Controls
document.getElementById('style-picker').addEventListener('change', (e) => {
  currentStyle = e.target.value;
  renderAll();
});

document.getElementById('protect-toggle').addEventListener('click', (e) => {
  protectionOn = !protectionOn;
  e.target.textContent = protectionOn ? 'Protection ON' : 'Protection OFF';
  e.target.classList.toggle('active', protectionOn);
  renderAll();
});

document.getElementById('reveal-toggle').addEventListener('click', (e) => {
  revealAll = !revealAll;
  e.target.textContent = revealAll ? 'Hide All' : 'Reveal All';
  e.target.classList.toggle('active', revealAll);
  renderAll();
});

// Initial render
renderAll();
</script>
</body>
</html>
